name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-i1:
    name: Gate I1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHELLCHECK_VERSION: 0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Provision pinned gate dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap=0.9.0-1ubuntu0.1

          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          destination="$RUNNER_TEMP/shellcheck"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$archive" | sha256sum --check --strict
          mkdir -- "$destination"
          tar --extract --xz --file "$archive" --directory "$destination" --strip-components=1
          printf '%s\n' "$destination" >> "$GITHUB_PATH"
          "$destination/shellcheck" --version
          bwrap --version

      - name: Run canonical I1 gate
        shell: bash
        env:
          I1_REQUIRE_SHELLCHECK: '1'
          PHASE_MANIFEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash tests/run-gate-i1.sh
